[project]
name = "ai-search-mcp"
version = "0.1.0"
description = "An MCP server for exposing Azure AI Search indexes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0.0",
    "azure-search-documents>=12.0.0"
]

[project.scripts]
start-mcp = "ai-search-mcp:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
